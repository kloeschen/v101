# CI: jeder Push und jeder PR läuft durch dieselben Tore wie die lokale
# Arbeit — aber über EINE Kette, nicht über aufgezählte Schritte.
#
# Befund M10: Vorher zählte dieser Workflow seine Prüfschritte einzeln auf.
# Damit gab es zwei Orte, an denen ein neuer Schritt eingetragen werden muss —
# package.json und diese Datei —, und der zweite liegt hinter einer
# Agentensperre. `scripts/check-freigabe.ts` stand deshalb in
# `npm run verify` und lief in der CI nie. Ein grüner Lauf hatte das nicht
# gezeigt; aufgefallen ist es erst beim Blick ins Job-Log.
#
# Jetzt ruft die CI `npm run verify:ci` auf. Wer einen Prüfschritt ergänzt,
# trägt ihn in package.json ein und nirgends sonst.
# `scripts/test-pruefkette.ts` hält diesen Zustand fest: Es prüft, dass hier
# nichts einzeln aufgezählt wird, dass jedes Prüfskript aus der Kette
# erreichbar ist, und dass der Checkout die Historie mitbringt.
#
# Preis dieser Bauart: GitHub zeigt einen Schritt statt sieben. Damit das Log
# lesbar bleibt, gibt `verify:ci` vor jedem Teilschritt eine Zeile der Form
# `::: [3/8 Inhalte (strict)] :::` aus.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie, nicht der Standard-Klon der Tiefe 1:
          # scripts/check-freigabe.ts vergleicht den Arbeitsstand gegen die
          # Basis und braucht dafür einen Vorgänger. Ohne das schlägt
          # --basis-pflicht fehl, und ohne --basis-pflicht liefe die Prüfung
          # stillschweigend ins Leere — genau der Zustand von M10.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prüfkette
        run: npm run verify:ci
